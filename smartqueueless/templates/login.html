{% extends "base.html" %}

{% block title %}
Login | SmartQueueLess
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <span class="section-label">
                SMARTQUEUELESS
            </span>

            <h1>
                Welcome back
            </h1>

            <p>
                Login to manage your digital queue.
            </p>

        </div>


        <form method="POST" class="auth-form">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-button full-width"
            >
                Login
            </button>

        </form>


        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Create Account
            </a>
        </p>

    </div>

</div>

{% endblock %}
